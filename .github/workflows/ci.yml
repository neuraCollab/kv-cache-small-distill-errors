name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only deps
        run: |
          python -m pip install --upgrade pip
          # Skip vLLM + sentence-transformers heavy CUDA extras in CI:
          # install only what the unmarked tests need.
          pip install pytest pytest-cov pytest-mock responses ruff mypy
          # CPU-only torch wheel — needed because tests/test_generators_hf.py
          # imports torch at module level (real tensors are required to
          # exercise the batched left-padding path that MagicMock can't
          # represent). The CPU wheel is ~200 MB but cached by setup-python.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Match the requirements.txt pin so CI catches API drift in the
          # same window the production deploy uses. transformers 4.55.x
          # broke HQQ QuantizedCache; 4.51.x is the known-good window.
          pip install 'transformers>=4.51,<4.52' 'tokenizers>=0.21' datasets huggingface_hub
          pip install pydantic pyyaml scipy numpy matplotlib tqdm tenacity
          pip install anthropic==0.40.0
          # mypy stub packages (no runtime impact)
          pip install types-PyYAML
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/kvtrace
      - name: Test (CPU, no live API)
        run: pytest -m "not gpu and not live_api" --cov=src/kvtrace --cov-fail-under=85
