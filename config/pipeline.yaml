pipeline:
  dataset:
    aime_24_count: 30
    math_500_count: 50
  seed: 42
  sampling:
    temperature: 0.0
    top_p: 1.0
    # 16K is sufficient for AIME / MATH-500 traces (rare to exceed 12K) and
    # caps the blast radius of any repetition loop that slips past the
    # repetition_penalty guard.
    max_tokens: 16384
    # >1.0 breaks degenerate repetition loops in R1-Distill at T=0; keep
    # constant across all quant methods so divergence comparisons stay valid.
    repetition_penalty: 1.05
    # HF Transformers backend has no continuous batching, so the only way to
    # raise GPU utilization on the HQQ KV-cache path is sized batches per
    # `model.generate()` call. 4 fits comfortably for 1.5B/1.7B/7B at 16K
    # context on a 24-48 GB GPU. vLLM ignores this — its scheduler batches
    # internally.
    hf_batch_size: 4
  fdp:
    context_window: 200
    resync_lookahead: 500
    cosmetic_cosine_threshold: 0.9
    max_cosmetic_skips: 5
    embed_model: sentence-transformers/all-MiniLM-L6-v2
  judge:
    model: claude-sonnet-4-6
    temperature: 0.0
    max_tokens: 400
    cache_dir: .cache/judge
    max_concurrent: 5
    calibration_threshold: 0.7
  hf_hub:
    repo_id_env: HF_REPO_ID
    repo_id_default_template: "{hf_user}/kv-trace"
    repo_type: dataset
